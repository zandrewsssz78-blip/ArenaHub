name: ArenaHub CI — Verificación y Seguridad

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Compilación, Pruebas y Seguridad (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reservas_deportivas
          POSTGRES_USER: arenahub
          POSTGRES_PASSWORD: arenahub_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: Auditoría de Secretos (Verificar que .env no esté en el repositorio)
        run: |
          if [ -f .env ]; then
            echo "ERROR: Archivo .env detectado en el repositorio. Viola la Regla 3 de Ciberseguridad."
            exit 1
          fi
          echo "Verificación de secretos exitosa: no hay archivo .env en Git."

      - name: Compilar y Ejecutar Pruebas Automatizadas
        env:
          ARENAHUB_TEST_DB_URL: jdbc:postgresql://localhost:5432/reservas_deportivas?currentSchema=arenahub_test
          ARENAHUB_DB_USER: arenahub
          ARENAHUB_DB_PASSWORD: arenahub_ci_password
        run: ./mvnw -B verify
